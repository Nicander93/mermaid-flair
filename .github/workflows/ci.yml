name: Verify and package

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm package
      - run: cmp manifest.json dist/obsidian/mermaid-flair/manifest.json
      - name: Verify ZIP integrity
        run: python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('dist/mermaid-flair-obsidian-*.zip')[0]); assert z.testzip() is None; assert len(z.namelist()) == 5"
      - uses: actions/upload-artifact@v4
        with:
          name: installable-plugins
          path: |
            dist/obsidian/mermaid-flair/
            dist/*.vsix
            dist/mermaid-flair-obsidian-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: playwright-report/
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: installable-plugins
          path: dist
      - name: Verify release version and checksums
        run: |
          node scripts/check-manifest.mjs "$GITHUB_REF_NAME"
          test "$(node -p "require('./apps/vscode/package.json').version")" = "$GITHUB_REF_NAME"
          cp dist/obsidian/mermaid-flair/* dist/
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Create and publish preview release
        run: |
          version="$GITHUB_REF_NAME"
          gh release create "$version" --verify-tag --draft --title "Mermaid Flair $version" \
            --notes-file "docs/releases/$version.md" \
            "dist/mermaid-flair-$version.vsix" "dist/mermaid-flair-obsidian-$version.zip" \
            dist/main.js dist/manifest.json dist/styles.css dist/LICENSE dist/THIRD_PARTY_NOTICES.txt dist/SHA256SUMS.txt
          gh release edit "$version" --draft=false --prerelease --latest=false
